name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Siapkan Folder Web & Inject App Version
        run: |
          npm install
          npm run build
          sed -i "s/__APP_VERSION__/v1.0.${{ github.run_number }}/g" www/index.html

      - name: Generate Android Project & App Icon
        run: |
          npm install -D @capacitor/assets
          npx cap add android
          
          IMG_FILE="assets/oranda.jpg"
          if [ -f "$IMG_FILE" ]; then
            pip install pillow -q
            python3 -c "from PIL import Image; img = Image.open('$IMG_FILE').convert('RGBA'); img.save('assets/icon.png'); img.save('assets/icon-only.png')"
            npx capacitor-assets generate --android --iconBackgroundColor '#06090e' --splashBackgroundColor '#06090e'
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            rm -f assets/icon.png assets/icon-only.png
          fi
          npx cap sync

            - name: Set Fullscreen Landscape Orientation
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          python3 -c '
          p = "android/app/src/main/java/id/my/ipps/aquabreed/MainActivity.java"
          code = """package id.my.ipps.aquabreed;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  );
              }
          }"""
          open(p, "w").write(code)
          '
      - name: Decode Keystore Permanen & Naikkan VersionCode
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d > android/app/release.keystore || true
          fi
          if [ ! -s android/app/release.keystore ]; then
            rm -f android/app/release.keystore
            keytool -genkey -v -keystore android/app/release.keystore -alias wadirect -keyalg RSA -keysize 2048 -validity 10000 -storepass wadirect123 -keypass wadirect123 -dname "CN=Wahyu Firman Nugraha, O=WFN, L=Tangerang, S=Banten, C=ID"
          fi
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/g' android/app/build.gradle

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password=wadirect123 \
            -Pandroid.injected.signing.key.alias=wadirect \
            -Pandroid.injected.signing.key.password=wadirect123

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk AquaBreed-HD.apk

      - name: Publish ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AquaBreed HD v1.0.${{ github.run_number }}
          body: |
            Rilis resmi game **AquaBreed HD** (Build #${{ github.run_number }}).
            Simulasi Aquascape & Breeding Ikan Hias 3D Realistis.
          files: AquaBreed-HD.apk
