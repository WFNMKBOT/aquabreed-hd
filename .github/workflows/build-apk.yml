name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Directory & Auto-Scan Aset
        run: |
          mkdir -p www/assets
          cp index.html www/
          if [ -d "assets" ]; then cp -r assets/* www/assets/ 2>/dev/null || true; fi

          python3 - << 'EOF'
          import os, json, hashlib

          assets_dir = "www/assets"
          ignored = {"bg-aquascape.jpg", "icon.png", "icon-only.png", "fishes-auto.js"}

          preset = {
              "neon":    {"name": "Neon Tetra",      "baseSize": 46,  "speed": 1.15, "price": 45,  "tiers": ["Black Neon Tetra", "Cardinal Tetra", "Diamond Blue Neon"]},
              "guppy":   {"name": "Guppy Dragon",    "baseSize": 60,  "speed": 0.95, "price": 60,  "tiers": ["Guppy Blue Grass", "Guppy Tuxedo Red", "Fancy Dragon Platinum"]},
              "oranda":  {"name": "Koki Oranda",     "baseSize": 82,  "speed": 0.55, "price": 80,  "tiers": ["Oranda Red Cap", "Oranda Tricolor", "Oranda Calico Royal"]},
              "betta":   {"name": "Cupang Halfmoon", "baseSize": 74,  "speed": 0.65, "price": 90,  "tiers": ["Halfmoon Royal Blue", "Halfmoon Bicolor", "Halfmoon Galaxy Neon"]},
              "manfish": {"name": "Manfish Angel",   "baseSize": 86,  "speed": 0.50, "price": 110, "tiers": ["Manfish Silver Zebra", "Manfish Golden", "Koi Marble Angel"]},
              "discus":  {"name": "Discus Royal",    "baseSize": 84,  "speed": 0.42, "price": 140, "tiers": ["Discus Pigeon Blood", "Discus Turquoise", "Red Melon Royal"]},
              "koi":     {"name": "Koi Kohaku",      "baseSize": 112, "speed": 0.62, "price": 190, "tiers": ["Koi Bekko", "Koi Sanke", "Tancho Kohaku"]},
              "arowana": {"name": "Arwana",          "baseSize": 132, "speed": 0.72, "price": 220, "tiers": ["Arwana Silver", "Arwana Golden Crossback", "Super Red Arwana"]}
          }

          species_out = {}
          paths_out = {"bg": "assets/bg-aquascape.jpg"}

          for fname in sorted(os.listdir(assets_dir)):
              if fname in ignored or not fname.lower().endswith((".jpg", ".jpeg", ".png")):
                  continue
              key = os.path.splitext(fname)[0].lower().replace(" ", "_")
              paths_out[key] = f"assets/{fname}"

              if key in preset:
                  p = preset[key]
                  disp_name, size, spd, price, tnames = p["name"], p["baseSize"], p["speed"], p["price"], p["tiers"]
              else:
                  h_hash = int(hashlib.md5(key.encode()).hexdigest()[:6], 16)
                  disp_name = key.replace("_", " ").replace("-", " ").title()
                  size = 70 + (h_hash % 40)
                  spd = round(0.48 + ((h_hash >> 4) % 45) / 100, 2)
                  price = 100 + ((h_hash >> 8) % 10) * 15
                  tnames = [f"{disp_name} Classic", f"{disp_name} Golden", f"{disp_name} Royal Epic"]

              species_out[key] = {
                  "name": disp_name,
                  "baseSize": size,
                  "speed": spd,
                  "price": price,
                  "fallbackColor": "#38bdf8",
                  "tiers": [
                      {"id": f"{key}_1", "name": tnames[0], "rarity": "Common", "hue": -15, "sat": 0.85, "val": 1.0,  "sell": int(price * 0.75)},
                      {"id": f"{key}_2", "name": tnames[1], "rarity": "Rare",   "hue": 24,  "sat": 1.2,  "val": 1.05, "sell": int(price * 2.1)},
                      {"id": f"{key}_3", "name": tnames[2], "rarity": "Epic",   "hue": 0,   "sat": 1.1,  "val": 1.05, "sell": int(price * 4.8)}
                  ]
              }

          with open(os.path.join(assets_dir, "fishes-auto.js"), "w") as f:
              f.write("window.AUTO_ASSET_PATHS = " + json.dumps(paths_out) + ";\n")
              f.write("window.AUTO_SPECIES = " + json.dumps(species_out) + ";\n")
          print("Auto-scan aset sukses!")
          EOF

      - name: Add, Configure Orientation & Sync Capacitor Android
        run: |
          npm install @capacitor/android
          npx cap add android || true
          python3 - << 'EOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()
          if "android:screenOrientation" in content:
              import re
              content = re.sub(r'android:screenOrientation="[^"]*"', 'android:screenOrientation="fullSensor"', content)
          else:
              content = content.replace('<activity', '<activity android:screenOrientation="fullSensor"', 1)
          with open(manifest_path, "w") as f:
              f.write(content)
          EOF
          npx cap sync android

      - name: Build APK with Gradle
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign & Prepare APK Output
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          else
            keytool -genkey -v -keystore android/app/release.keystore -alias wadirect -keyalg RSA -keysize 2048 -validity 10000 -storepass wadirect123 -keypass wadirect123 -dname "CN=Wahyu Firman Nugraha, O=WFN, L=Tangerang, S=Banten, C=ID"
          fi
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          $APKSIGNER sign --ks android/app/release.keystore --ks-key-alias wadirect --ks-pass pass:wadirect123 --key-pass pass:wadirect123 --out build-output/Aquatopia.apk "$APK_FILE"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Aquatopia Latest Build (Auto)"
          files: build-output/Aquatopia.apk
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
